[pytest]
testpaths = tests
markers =
    slow: hits a live model or the network; minutes, not milliseconds
    integration: needs a live backend on :8001 (applied automatically to *_backend.py)

# `pytest` runs everywhere: the unit tests execute and the integration files
# skip themselves when nothing is listening on :8001.
#
#   pytest                          unit tests, integration skipped if no server
#   pytest -m "not slow"            everything quick, including live API checks
#   WARROOM_REQUIRE_BACKEND=1 pytest    CI: an unreachable backend is a failure
